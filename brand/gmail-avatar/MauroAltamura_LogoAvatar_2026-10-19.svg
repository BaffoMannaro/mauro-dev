<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Mauro Altamura, logo avatar</title>
  <!--
    File di partenza per l'animazione. Ogni elemento animabile ha un id.
    Colori: fondo #4C5760, tratto #CBD2D0, piega #FFFFFF, accento sito #DCF23C.
    Il segno sta dentro il cerchio di ritaglio di Gmail (raggio 256).
  -->
  <defs>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1E2429" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect id="fondo" width="512" height="512" fill="#4C5760"/>
  <!-- Tratto: diagonale (dal centro verso l'alto a destra) + asta verticale destra -->
  <path id="tratto" d="M218.8 293.7 L355 126 L355 386" fill="none" stroke="#CBD2D0"
        stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Piega: triangolo bianco incernierato sul lato sinistro -->
  <g id="piega" filter="url(#ombra)">
    <path d="M155.8 124.9 L259.2 252.1 Q262.3 256.0 259.2 259.9 L155.8 387.1 Q147.0 398.0 147.0 384.0 L147.0 128.0 Q147.0 114.0 155.8 124.9 Z" fill="#FFFFFF"/>
  </g>
</svg>

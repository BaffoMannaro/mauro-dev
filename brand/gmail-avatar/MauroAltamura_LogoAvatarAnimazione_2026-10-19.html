<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar animato</title>
<style>
  html, body { margin: 0; background: #17181A; }
  body { display: grid; place-items: center; min-height: 100vh; }
  svg { width: 512px; height: 512px; display: block; }
  body.anteprima svg { clip-path: circle(50%); }
</style>
</head>
<body>
<!--
  Timeline (3,6 s in loop, 25 fps = 90 fotogrammi). Primo e ultimo fotogramma = logo fermo,
  cosi' i client che mostrano solo il primo frame vedono il logo completo.
  0,00-0,70 pausa | 0,70-1,20 il tratto si ritira | 0,75-1,15 la piega si chiude sulla cerniera
  1,10-1,60 resta la cerniera in verde accento | 1,55-2,25 il tratto si ridisegna
  1,75-2,45 la piega si riapre con leggero rimbalzo | 2,45-3,60 pausa
-->
<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1E2429" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#4C5760"/>
  <path id="tratto" d="M240 279 L355 126 L355 384" fill="none" stroke="#CBD2D0"
        stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <line id="cerniera" x1="153" y1="122" x2="153" y2="390" stroke="#DCF23C"
        stroke-width="14" stroke-linecap="round" opacity="0"/>
  <g filter="url(#ombra)">
    <path id="piega" d="M147 126 Q147 112 160 120 L258 248 Q264 256 258 264 L160 392 Q147 400 147 386 Z" fill="#FFFFFF"/>
  </g>
</svg>
<script>
  const DURATA = 3.6;
  const clamp = v => Math.min(1, Math.max(0, v));
  const fase = (t, a, b) => clamp((t - a) / (b - a));
  const inCubic = p => p * p * p;
  const outCubic = p => 1 - Math.pow(1 - p, 3);
  const inOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const outBack = p => { const c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

  const tratto = document.getElementById('tratto');
  const piega = document.getElementById('piega');
  const cerniera = document.getElementById('cerniera');
  const L = tratto.getTotalLength();
  tratto.style.strokeDasharray = `${L} ${L}`;

  function render(t) {
    t = ((t % DURATA) + DURATA) % DURATA;
    // Tratto: si ritira verso il basso a destra, poi si ridisegna da li'
    const via = inCubic(fase(t, 0.70, 1.20));
    const torna = outCubic(fase(t, 1.55, 2.25));
    const visibile = t < 1.55 ? 1 - via : torna;
    tratto.style.strokeDashoffset = -L * (1 - visibile);
    tratto.style.opacity = visibile < 0.01 ? 0 : 1;

    // Piega: si chiude sulla cerniera sinistra, poi si riapre con un rimbalzo
    let sx;
    if (t < 1.75) sx = 1 - inOut(fase(t, 0.75, 1.15));
    else sx = outBack(fase(t, 1.75, 2.45));
    sx = Math.max(sx, 0.0001);
    piega.setAttribute('transform', `translate(147 0) scale(${sx} 1) translate(-147 0)`);

    // Cerniera in verde accento: compare a piega chiusa, sparisce mentre si riapre
    const accesa = fase(t, 1.00, 1.15) * (1 - fase(t, 1.80, 2.05));
    const pulsa = 1 + 0.05 * Math.sin(Math.PI * fase(t, 1.15, 1.70));
    cerniera.setAttribute('opacity', accesa.toFixed(3));
    cerniera.setAttribute('transform', `translate(0 256) scale(1 ${pulsa}) translate(0 -256)`);
  }
  window.render = render;
  window.DURATA = DURATA;

  // Anteprima nel browser (?export disattiva il loop automatico)
  if (!location.search.includes('export')) {
    document.body.classList.add('anteprima');
    const t0 = performance.now();
    const loop = now => { render((now - t0) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    render(0);
  }
</script>
</body>
</html>
